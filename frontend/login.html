<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - G2API</title>
    <style>
        :root {
            --bg:#0a0e1a;
            --panel:#0f1420;
            --muted:#8b95a8;
            --text:#e8f0ff;
            --accent:#4f8fff;
            --border:#1a2332;
            --glow:rgba(79,143,255,.15);
        }
        * { box-sizing:border-box; }
        html, body { height:100%; margin:0; }
        body {
            background:radial-gradient(ellipse at top, #0f1624 0%, #0a0e1a 100%);
            color:var(--text);
            font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            padding:20px;
        }
        .container { width:100%; max-width:420px; }
        .header { text-align:center; margin-bottom:32px; }
        h1 {
            font-size:32px;
            font-weight:700;
            margin:0 0 8px;
            background:linear-gradient(135deg,#4f8fff,#7b9fff);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }
        .subtitle { color:var(--muted); font-size:14px; }
        .panel {
            background:linear-gradient(145deg,rgba(15,20,32,.8),rgba(10,14,26,.9));
            border:1px solid var(--border);
            border-radius:16px;
            padding:32px;
            box-shadow:0 20px 60px rgba(0,0,0,.4);
        }
        .field { margin-bottom:24px; }
        label { display:block; color:var(--muted); font-size:13px; margin-bottom:8px; }
        input {
            width:100%;
            background:rgba(12,16,28,.6);
            color:var(--text);
            border:1px solid var(--border);
            border-radius:12px;
            padding:12px 14px;
            outline:none;
            font-size:14px;
        }
        input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); }
        button {
            width:100%;
            background:linear-gradient(135deg,#2563eb,#1e40af);
            color:#fff;
            border:none;
            border-radius:12px;
            padding:12px 20px;
            font-weight:600;
            font-size:14px;
            cursor:pointer;
        }
        button:hover { transform:translateY(-1px); }
        button:disabled { opacity:.5; cursor:not-allowed; }
        .toast {
            position:fixed;
            bottom:20px;
            right:20px;
            padding:12px 20px;
            border-radius:12px;
            color:#fff;
            font-size:14px;
            background:linear-gradient(135deg,#dc2626,#991b1b);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>G2API</h1>
            <p class="subtitle">Admin Console</p>
        </div>
        <div class="panel">
            <form id="loginForm">
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password" autofocus>
                </div>
                <button type="submit" id="loginButton">Login</button>
            </form>
        </div>
    </div>
    <script>
        const form=document.getElementById('loginForm'),btn=document.getElementById('loginButton');
        form.addEventListener('submit',async(e)=>{
            e.preventDefault();
            btn.disabled=true;
            btn.textContent='Logging in...';
            try{
                const fd=new FormData(form),r=await fetch('/api/login',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({password:fd.get('password')})
                });
                const d=await r.json();
                if(d.success){
                    localStorage.setItem('adminPassword',fd.get('password'));
                    location.href='/';
                }else{
                    showToast(d.message||'Login failed');
                }
            }catch(e){
                showToast('Network error');
            }finally{
                btn.disabled=false;
                btn.textContent='Login';
            }
        });
        function showToast(m){
            const d=document.createElement('div');
            d.className='toast';
            d.textContent=m;
            document.body.appendChild(d);
            setTimeout(()=>d.remove(),2000);
        }
    </script>
</body>
</html>
